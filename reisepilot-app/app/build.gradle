    compileSdk 35

    defaultConfig {
        applicationId 'de.balabucha.reisepilot'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
