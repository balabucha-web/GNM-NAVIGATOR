name: Build ReisePilot 5.0 APK

on:
  push:
    branches:
      - reisepilot-v50-visual-redesign
    paths:
      - 'reisepilot/**'
      - '.github/workflows/reisepilot-v50-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: reisepilot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply ReisePilot 5.0 visual migration
        run: |
          set -euo pipefail
          if [ -f scripts/apply_v50_visual.py.gz.b64 ]; then
            base64 -d scripts/apply_v50_visual.py.gz.b64 | gzip -d > /tmp/apply_v50_visual.py
            python3 /tmp/apply_v50_visual.py
            rm scripts/apply_v50_visual.py.gz.b64
          fi
      - name: Commit migrated 5.0 sources
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Sources already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(reisepilot): apply 5.0 visual redesign'
          git push
      - name: Verify 5.0 visual guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/de/balabucha/reisepilot')
          required = {
              'Ui.kt': ['PACKING("Packliste")', 'NavigationBarItemDefaults.colors', 'SoftBlue'],
              'VisualComponents.kt': ['RoadTripHeroCard', 'DrivingFocusCard', 'MapLayerControls'],
              'LiveScreen.kt': ['RoadTripHeroCard(snapshot', 'JourneyMetricStrip(snapshot)', 'DrivingFocusCard(snapshot)'],
              'DiscoverScreen.kt': ['Details & Bilder', 'height(188.dp)', 'DestinationOfflinePhoto(place'],
              'MapScreen.kt': ['showTraffic', 'MapLayerControls', 'showTolls'],
              'NativeTripMap.kt': ['latestShowTraffic', 'latestShowFuel', 'latestShowParking'],
              'MainActivity.kt': ['FLAG_KEEP_SCREEN_ON', 'updateKeepScreenOn'],
              'MoreScreen.kt': ['Bildschirm während der Reise aktiv', 'keep_screen_on'],
          }
          for name, markers in required.items():
              text = (root / name).read_text()
              for marker in markers:
                  assert marker in text, f'{name}: missing {marker}'
          version = Path('app/build.gradle.kts').read_text()
          assert 'versionName = "5.0"' in version
          assert 'versionCode = 22' in version
          print('PASS: ReisePilot 5.0 visual guards present')
          PY
      - name: Check live sources and image service
        run: |
          python3 scripts/check_live_data.py
          python3 scripts/check_wikimedia_images.py
      - name: Test, lint and build APK
        id: build
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/ReisePilot-Live-v5.0.sha256
          fi
          exit 0
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-v5.0-build-evidence
          path: |
            reisepilot/build.log
            reisepilot/app/build/reports/tests/testDebugUnitTest
            reisepilot/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-Live-v5.0-APK
          path: |
            reisepilot/app/build/outputs/apk/debug/app-debug.apk
            reisepilot/app/build/outputs/apk/debug/ReisePilot-Live-v5.0.sha256
          if-no-files-found: error
      - name: Fail when validation failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
