name: Build ReisePilot 5.7 Build31

on:
  push:
    branches: ["reisepilot-build31"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Rebuild project archive
        run: |
          cat project.b64.part-00 project.b64.part-01 project.b64.part-02 project.b64.part-03a project.b64.part-03b project.b64.part-03c project.b64.part-04 > project.b64
          base64 -d project.b64 > project.zip
          unzip -t project.zip
      - name: Extract project
        run: |
          mkdir project
          unzip -q project.zip -d project
          sed -i '/import androidx.compose.foundation.layout.Box/a import androidx.compose.foundation.layout.fillMaxSize' project/app/src/main/java/de/balabucha/reisepilot/DestinationRepository.kt
          sed -i 's/Modifier.matchParentSize()/Modifier.fillMaxSize()/' project/app/src/main/java/de/balabucha/reisepilot/DestinationRepository.kt
          sed -i 's@Diagnostics.event(context, "destination_image_error", mapOf("name" to photo.name, "error" to (it.message ?: it.javaClass.simpleName)))@Diagnostics.log(context, "destination_image_error", org.json.JSONObject().put("name", photo.name).put("error", it.message ?: it.javaClass.simpleName))@' project/app/src/main/java/de/balabucha/reisepilot/DestinationRepository.kt
          awk '!/org.jetbrains.kotlin.android/' project/build.gradle.kts > project/build.gradle.kts.new
          mv project/build.gradle.kts.new project/build.gradle.kts
          awk '!/org.jetbrains.kotlin.android/' project/app/build.gradle.kts > project/app/build.gradle.kts.new
          mv project/app/build.gradle.kts.new project/app/build.gradle.kts
      - name: Build debug APK
        run: |
          set +e
          cd project
          gradle :app:assembleDebug --stacktrace > ../build.log 2>&1
          code=$?
          cat ../build.log
          exit $code
      - name: Collect APK
        if: success()
        run: cp project/app/build/outputs/apk/debug/app-debug.apk ReisePilot-Live-v5.7-Build31.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ReisePilot-Live-v5.7-Build31
          path: ReisePilot-Live-v5.7-Build31.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ReisePilot-Build31-log
          path: build.log
          if-no-files-found: warn
