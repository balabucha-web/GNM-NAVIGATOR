name: Build ReisePilot 5.5.1 APK

on:
  push:
    branches:
      - reisepilot-v41-release-fixes
    paths:
      - 'reisepilot/**'
      - '.github/workflows/reisepilot-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'reisepilot/**'
      - '.github/workflows/reisepilot-apk.yml'
  workflow_dispatch:

concurrency:
  group: reisepilot-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reisepilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify ReisePilot 5.5.1 sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/de/balabucha/reisepilot')
          required = {
              'Ui.kt': [
                  'PACKING("Packliste")',
                  'HomeDashboard55',
                  'MapScreen54',
                  'VisualDiscoverScreen51',
                  'MoreHubScreen51',
                  'bottom = 86.dp',
              ],
              'HomeDashboard55.kt': [
                  'Was kommt als Nächstes?',
                  'Tank und Reichweite',
                  'Wetter entlang der Route',
                  'ReisePilot empfiehlt'.upper(),
                  'Deine Reise',
                  'ANKUNFTSMODUS',
                  'Nachtansicht',
                  'NativeTripMap54',
                  'DestinationOfflinePhoto',
                  'open-reise-assistant',
              ],
              'WeatherClient55.kt': [
                  'https://api.open-meteo.com/v1/forecast',
                  'precipitation_probability',
                  'wind_speed_10m',
                  'sunset',
                  'Offline-Wetter',
              ],
              'HomeAssistant55.kt': [
                  'Sprechen & fragen',
                  'AI-Modus und API-Key',
                  'DirectOpenAiClient53.ask',
                  'AssistantClient52.ask',
                  'SecureApiKeyStore53',
                  'Zur Packliste hinzufügen?',
              ],
              'RealtimeDriveController54.kt': [
                  'PRIORITY_HIGH_ACCURACY, 1_000L',
                  'setMinUpdateIntervalMillis(500L)',
                  'RoadAheadStore54',
                  'LiveFuelOptions54.query',
                  'RoadsideClient54.query',
              ],
              'RoadAheadUi54.kt': [
                  'ECHTZEIT · WAS KOMMT ALS NÄCHSTES?',
                  'Tankstellen abseits der Autobahn',
                  'Raststätten, Rastplätze und Parkplätze',
              ],
              'LiveFuelOptions54.kt': [
                  'Tankerkönig',
                  'offizieller Dieselpreis',
                  'Fahrtrichtung und Umweg geprüft',
                  'take(4)',
              ],
              'RoadsideClient54.kt': [
                  'highway~"^(services|rest_area)$"',
                  'amenity=parking',
                  'parking=layby',
                  'Fahrtrichtung geprüft',
              ],
              'MapScreen54.kt': [
                  'Rastplätze',
                  'Tankstellen abseits der Autobahn',
                  'Live aktualisieren',
                  'NativeTripMap54',
              ],
              'DestinationOfflinePhoto.kt': [
                  'entry?.isPhoto == false',
                  'WikiImageResolver.resolve',
                  'AsyncImage',
                  'exact POI photo',
              ],
              'SecureApiKeyStore53.kt': [
                  'AndroidKeyStore',
                  'AES/GCM/NoPadding',
                  'reisepilot_openai_test_key_v1',
              ],
              'DirectOpenAiClient53.kt': [
                  'https://api.openai.com/v1/responses',
                  'store',
                  'json_schema',
                  'OPENAI_DIRECT',
                  'incomplete_details',
                  'FIRST_OUTPUT_LIMIT',
                  'RETRY_OUTPUT_LIMIT',
                  'compactRetryContext',
                  '"effort", "minimal"',
                  'OpenAI konnte die strukturierte Antwort nicht vollständig abschließen',
              ],
              'MainActivity.kt': [
                  'RealtimeDriveController54',
                  'refreshRoadAhead54',
                  'FLAG_KEEP_SCREEN_ON',
              ],
          }
          for name, markers in required.items():
              text = (root / name).read_text()
              for marker in markers:
                  assert marker in text, f'{name}: missing {marker}'
          version = Path('app/build.gradle.kts').read_text()
          assert 'versionName = "5.5.1"' in version
          assert 'versionCode = 28' in version
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android.permission.RECORD_AUDIO' in manifest
          backend = Path('backend/openai-proxy/server.mjs').read_text()
          assert "store: false" in backend
          assert "json_schema" in backend
          assert "OPENAI_API_KEY" in backend
          assert "openai_incomplete" in backend
          assert "compactRetryContext" in backend
          assert "effort: 'minimal'" in backend
          repo_text = '\n'.join(path.read_text(errors='ignore') for path in Path('.').rglob('*') if path.is_file() and '.git' not in path.parts)
          assert 'sk-proj-' not in repo_text
          print('PASS: ReisePilot 5.5.1 visual dashboard and OpenAI incomplete-response recovery present')
          PY
          node --check backend/openai-proxy/server.mjs
      - name: Check live sources and Wikimedia images
        run: |
          python3 scripts/check_live_data.py
          python3 scripts/check_wikimedia_images.py
      - name: Verify offline destination assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assets = Path('app/src/main/assets')
          entries = json.loads((assets / 'destination_photos/index.json').read_text())['places']
          assert len(entries) == 93, len(entries)
          actual = sum(bool(item['photo']) for item in entries.values())
          assert actual >= 75, actual
          parking = json.loads((assets / 'destination_parkings.json').read_text())['places']
          assert len(parking) == 93
          assert sum(bool(items) for items in parking.values()) == 93
          print(f'PASS: {len(entries)} destinations, {actual} exact offline photos, remaining gaps use exact cached lookup, complete parking fallbacks')
          PY
      - name: Unit tests, lint and APK build
        id: build
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/ReisePilot-Live-v5.5.1.sha256
          fi
          exit 0
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-v5.5.1-build-evidence
          path: |
            reisepilot/build.log
            reisepilot/app/build/reports/tests/testDebugUnitTest
            reisepilot/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-Live-v5.5.1-APK
          path: |
            reisepilot/app/build/outputs/apk/debug/app-debug.apk
            reisepilot/app/build/outputs/apk/debug/ReisePilot-Live-v5.5.1.sha256
          if-no-files-found: error
      - name: Fail when validation failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
