name: Build ReisePilot 4.9 APK

on:
  push:
    branches:
      - reisepilot-v41-release-fixes
    paths:
      - 'reisepilot/**'
      - '.github/workflows/reisepilot-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'reisepilot/**'
      - '.github/workflows/reisepilot-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: reisepilot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply guarded source migration
        run: |
          set -euo pipefail
          if [ -f scripts/apply_v41_fixes.py.gz.b64 ]; then
            base64 -d scripts/apply_v41_fixes.py.gz.b64 | gzip -d > /tmp/apply_v41_fixes.py
            python3 /tmp/apply_v41_fixes.py
            rm scripts/apply_v41_fixes.py.gz.b64
          fi
          if [ -f scripts/apply_v41_hotfix.py ]; then
            python3 scripts/apply_v41_hotfix.py
            rm scripts/apply_v41_hotfix.py
          fi
          if [ -f scripts/apply_v42_upgrade.py ]; then
            python3 scripts/apply_v42_upgrade.py
            rm scripts/apply_v42_upgrade.py
          fi
          if [ -f scripts/apply_v44_upgrade.py ]; then
            python3 scripts/apply_v44_upgrade.py
            rm scripts/apply_v44_upgrade.py
          fi
          if [ -f scripts/apply_destination_test_tags.py ]; then
            python3 scripts/apply_destination_test_tags.py
            rm scripts/apply_destination_test_tags.py
          fi
      - name: Commit migrated sources to release branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Sources already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(reisepilot): apply guarded source migration'
          git push
      - name: Verify release-critical guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/de/balabucha/reisepilot')
          required = {
              'DiscoverData.kt': ['distanceKm <= region.radiusKm'],
              'DiscoverScreen.kt': ['destinationCardTag(place)', 'testTag'],
              'FuelPriceClient.kt': ['CountryResolver', 'Fahrumweg geprüft', 'MotorwayFilter'],
              'TripTrackingService.kt': ['sessionId != requestSession', 'val newlyCrossed = crossed.filter', 'ACTION_RESET', 'private fun resetTrip()', 'promoteTestToReal'],
              'NativeTripMap.kt': ['tiles.openfreemap.org/styles/liberty', 'fun dispose()', '€/l'],
              'LiveScreen.kt': ['Geschätzter Tankinhalt', 'Frankreich-Verkehr live', 'Deutschland-Verkehr live', 'Ankunftszeit', 'LinearProgressIndicator', 'vacation-countdown', 'Testfahrt starten', 'Reise starten'],
              'DepartureCountdown.kt': ['VACATION_DEPARTURE', 'Europe/Berlin', 'departureCountdown', 'tripModeAt'],
              'WikiImage.kt': ['travel_photos_v48', 'resolveGallery', 'wikidataCandidates', 'commonsGeoCandidates', 'commonsCategoryCandidates'],
              'DestinationMedia.kt': ['DestinationMediaCatalog', 'Temple Expiatori de la Sagrada Família'],
              'DestinationOfflinePhoto.kt': ['DestinationOfflinePhotoCatalog', 'destination_photos/index.json'],
              'Parking.kt': ['ParkingResolver', 'ParkingSelectionStore', 'BSM Moll de la Fusta', 'overpass-api.de', 'maps.mail.ru', 'overpass.private.coffee'],
              'OfflineParking.kt': ['OfflineParkingCatalog', 'destination_parkings.json'],
              'LiveDataDiagnostics.kt': ['LiveDataDiagnostics', 'OSM-Parkplätze', 'Frankreich-Diesel', 'OpenFreeMap-Kartenstil'],
              'PackingModels.kt': ['packing-v1-cat-16-luggage', 'DefaultPackingList'],
              'PackingRepository.kt': ['INITIALIZED_KEY', 'restoreMissingDefaults', 'resetChecks'],
              'PackingScreen.kt': ['Neuer Eintrag', 'Kategorien verwalten', 'Rückgängig'],
              'BisonTrafficClient.kt': ['RecapTraficFranceEntiere.html', 'Straße gesperrt'],
              'GermanTrafficClient.kt': ['verkehr.autobahn.de/o/autobahn', 'roadworks'],
          }
          for name, markers in required.items():
              text = (root / name).read_text()
              for marker in markers:
                  assert marker in text, f'{name}: missing {marker}'
          version = Path('app/build.gradle.kts').read_text()
          assert 'versionName = "4.9"' in version
          assert 'versionCode = 21' in version
          print('PASS: ReisePilot 4.9 release guards present')
          PY
      - name: Check all live data sources
        run: python3 scripts/check_live_data.py
      - name: Check Wikimedia image service
        run: python3 scripts/check_wikimedia_images.py
      - name: Verify offline destination photos and parking fallbacks
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assets = Path('app/src/main/assets')
          photos = json.loads((assets / 'destination_photos/index.json').read_text())
          entries = photos['places']
          assert len(entries) == 93, f'offline photos: {len(entries)}/93'
          actual = sum(bool(item['photo']) for item in entries.values())
          assert actual >= 75, f'only {actual}/93 exact offline photos'
          for region in ('canet', 'barcelona', 'andorra', 'paris'):
              sprite = assets / f'destination_photos/{region}.webp'
              assert sprite.stat().st_size > 50_000, f'{sprite} is incomplete'
          parking = json.loads((assets / 'destination_parkings.json').read_text())['places']
          covered = sum(bool(items) for items in parking.values())
          assert len(parking) == 93 and covered == 93, f'offline parking coverage {covered}/93'
          print(f'PASS: 93 offline previews ({actual} photos) and {covered}/93 parking fallbacks')
          PY
      - name: Guard destination image loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/de/balabucha/reisepilot/DiscoverScreen.kt').read_text()
          assert 'DestinationOfflinePhoto(place' in text, 'Offline list and detail previews are required'
          assert text.count('AsyncImage(') >= 1, 'Detail gallery image loader is required'
          assert 'itemsIndexed(gallery' in text and 'val totalImages = gallery.size' in text
          assert '"$displayIndex / $totalImages"' in text
          resolver = Path('app/src/main/java/de/balabucha/reisepilot/WikiImage.kt').read_text()
          assert 'resolveGallery' in resolver and 'commonsGeoCandidates' in resolver
          assert 'imageFallback' not in resolver, 'Generic region photos must not replace exact POI photos'
          print('PASS: exact POI photo gallery and local cache are present')
          PY
      - name: Test, lint and build debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/ReisePilot-Live-v4.9.sha256
          fi
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-v4.9-build-log
          path: reisepilot/build.log
          if-no-files-found: warn
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-v4.9-reports
          path: |
            reisepilot/app/build/reports/tests/testDebugUnitTest
            reisepilot/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-Live-v4.9-APK
          path: |
            reisepilot/app/build/outputs/apk/debug/app-debug.apk
            reisepilot/app/build/outputs/apk/debug/ReisePilot-Live-v4.9.sha256
          if-no-files-found: error
      - name: Fail when validation failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
