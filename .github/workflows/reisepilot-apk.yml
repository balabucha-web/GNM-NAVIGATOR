name: Build ReisePilot APK

on:
  push:
    branches:
      - reisepilot-live-v34
    paths:
      - 'reisepilot/**'
      - '.github/workflows/reisepilot-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'reisepilot/**'
      - '.github/workflows/reisepilot-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: reisepilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Check Wikimedia image service
        run: python3 scripts/check_wikimedia_images.py
      - name: Test, lint and build debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-v3.4-build-log
          path: reisepilot/build.log
          if-no-files-found: warn
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-v3.4-reports
          path: |
            reisepilot/app/build/reports/tests/testDebugUnitTest
            reisepilot/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-Live-v3.4-APK
          path: reisepilot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Fail when validation failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
