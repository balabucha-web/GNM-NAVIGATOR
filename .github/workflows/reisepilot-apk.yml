name: Build ReisePilot 5.2 APK

on:
  push:
    branches:
      - reisepilot-v41-release-fixes
    paths:
      - 'reisepilot/**'
      - '.github/workflows/reisepilot-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'reisepilot/**'
      - '.github/workflows/reisepilot-apk.yml'
  workflow_dispatch:

concurrency:
  group: reisepilot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reisepilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify ReisePilot 5.2 sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/de/balabucha/reisepilot')
          required = {
              'Ui.kt': [
                  'PACKING("Packliste")',
                  'VisualLiveScreen52',
                  'MapScreen51',
                  'VisualDiscoverScreen51',
                  'MoreHubScreen51',
                  'bottom = 86.dp',
              ],
              'AssistantScreen52.kt': [
                  'Reise-Assistent',
                  'OPENAI-BACKEND BEREIT',
                  'LOKALER MODUS',
                  'Zur Packliste hinzufügen?',
                  'niemals ein OpenAI-API-Schlüssel',
              ],
              'AssistantClient52.kt': [
                  'Authorization',
                  'https',
                  'assistantAnswerFromJson52',
              ],
              'AssistantContext52.kt': [
                  'positionRounded',
                  'personalNamesIncluded',
                  'Wetterdaten sind in diesem Build noch nicht angebunden',
              ],
              'AssistantOffline52.kt': [
                  'Lokale ReisePilot-Auswertung',
                  'PACKING_CHECK',
                  'FUEL_PLAN',
              ],
              'VisualScreens51.kt': [
                  'TESTMODUS',
                  'TRACKING AKTIV',
                  'ab aktuellem Standort',
              ],
              'MainActivity.kt': [
                  'FLAG_KEEP_SCREEN_ON',
                  'updateKeepScreenOn',
              ],
          }
          for name, markers in required.items():
              text = (root / name).read_text()
              for marker in markers:
                  assert marker in text, f'{name}: missing {marker}'
          version = Path('app/build.gradle.kts').read_text()
          assert 'versionName = "5.2"' in version
          assert 'versionCode = 24' in version
          backend = Path('backend/openai-proxy/server.mjs').read_text()
          assert "store: false" in backend
          assert "json_schema" in backend
          assert "OPENAI_API_KEY" in backend
          print('PASS: ReisePilot 5.2 assistant sources present')
          PY
          node --check backend/openai-proxy/server.mjs
      - name: Check live sources and Wikimedia images
        run: |
          python3 scripts/check_live_data.py
          python3 scripts/check_wikimedia_images.py
      - name: Verify offline destination assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assets = Path('app/src/main/assets')
          entries = json.loads((assets / 'destination_photos/index.json').read_text())['places']
          assert len(entries) == 93, len(entries)
          actual = sum(bool(item['photo']) for item in entries.values())
          assert actual >= 75, actual
          parking = json.loads((assets / 'destination_parkings.json').read_text())['places']
          assert len(parking) == 93
          assert sum(bool(items) for items in parking.values()) == 93
          print(f'PASS: {len(entries)} destinations, {actual} exact offline photos, complete parking fallbacks')
          PY
      - name: Unit tests, lint and APK build
        id: build
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/ReisePilot-Live-v5.2.sha256
          fi
          exit 0
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-v5.2-build-evidence
          path: |
            reisepilot/build.log
            reisepilot/app/build/reports/tests/testDebugUnitTest
            reisepilot/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-Live-v5.2-APK
          path: |
            reisepilot/app/build/outputs/apk/debug/app-debug.apk
            reisepilot/app/build/outputs/apk/debug/ReisePilot-Live-v5.2.sha256
          if-no-files-found: error
      - name: Fail when validation failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
