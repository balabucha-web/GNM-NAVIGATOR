name: Build ReisePilot 4.3 APK

on:
  push:
    branches:
      - reisepilot-v41-release-fixes
    paths:
      - 'reisepilot/**'
      - '.github/workflows/reisepilot-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'reisepilot/**'
      - '.github/workflows/reisepilot-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: reisepilot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply guarded source migration
        run: |
          set -euo pipefail
          if [ -f scripts/apply_v41_fixes.py.gz.b64 ]; then
            base64 -d scripts/apply_v41_fixes.py.gz.b64 | gzip -d > /tmp/apply_v41_fixes.py
            python3 /tmp/apply_v41_fixes.py
            rm scripts/apply_v41_fixes.py.gz.b64
          fi
          if [ -f scripts/apply_v41_hotfix.py ]; then
            python3 scripts/apply_v41_hotfix.py
            rm scripts/apply_v41_hotfix.py
          fi
          if [ -f scripts/apply_v42_upgrade.py ]; then
            python3 scripts/apply_v42_upgrade.py
            rm scripts/apply_v42_upgrade.py
          fi
      - name: Commit migrated sources to release branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Sources already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(reisepilot): apply guarded source migration'
          git push
      - name: Verify release-critical guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/de/balabucha/reisepilot')
          required = {
              'DiscoverData.kt': ['distanceKm <= region.radiusKm'],
              'FuelPriceClient.kt': ['CountryResolver', 'Fahrumweg geprüft', 'MotorwayFilter'],
              'TripTrackingService.kt': ['sessionId != requestSession', 'val newlyCrossed = crossed.filter'],
              'NativeTripMap.kt': ['tiles.openfreemap.org/styles/liberty', 'fun dispose()', '€/l'],
              'LiveScreen.kt': ['Geschätzter Tankinhalt', 'Frankreich-Verkehr live', 'LinearProgressIndicator'],
              'WikiImage.kt': ['travel_photos_v43', 'downloadImage'],
              'BisonTrafficClient.kt': ['RecapTraficFranceEntiere.html', 'Straße gesperrt'],
          }
          for name, markers in required.items():
              text = (root / name).read_text()
              for marker in markers:
                  assert marker in text, f'{name}: missing {marker}'
          version = Path('app/build.gradle.kts').read_text()
          assert 'versionName = "4.3"' in version
          assert 'versionCode = 12' in version
          print('PASS: ReisePilot 4.3 release guards present')
          PY
      - name: Check Wikimedia image service
        run: python3 scripts/check_wikimedia_images.py
      - name: Guard destination image loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/de/balabucha/reisepilot/DiscoverScreen.kt').read_text()
          assert text.count('AsyncImage(') >= 2, 'List thumbnail and detail image loaders are required'
          resolver = Path('app/src/main/java/de/balabucha/reisepilot/WikiImage.kt').read_text()
          assert 'Uri.fromFile' in resolver and 'downloadImage' in resolver
          print('PASS: destination photos are downloaded to local cache')
          PY
      - name: Test, lint and build debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/ReisePilot-Live-v4.3.sha256
          fi
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-v4.3-build-log
          path: reisepilot/build.log
          if-no-files-found: warn
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-v4.3-reports
          path: |
            reisepilot/app/build/reports/tests/testDebugUnitTest
            reisepilot/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-Live-v4.3-APK
          path: |
            reisepilot/app/build/outputs/apk/debug/app-debug.apk
            reisepilot/app/build/outputs/apk/debug/ReisePilot-Live-v4.3.sha256
          if-no-files-found: error
      - name: Fail when validation failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
