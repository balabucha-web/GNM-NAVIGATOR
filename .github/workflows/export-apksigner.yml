name: Export Android signing tool

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate apksigner
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -print | sort -V | tail -1)"
          test -f "$JAR"
          cp "$JAR" apksigner.jar
          java -jar apksigner.jar version
          sha256sum apksigner.jar > apksigner.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-tool
          path: |
            apksigner.jar
            apksigner.jar.sha256
          if-no-files-found: error
