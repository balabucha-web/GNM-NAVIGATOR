name: Recover ReisePilot 5.8 Build 32 source

on:
  push:
    branches:
      - "reisepilot-build32-recovery"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble source archive
        run: cat source.part00 source.part01 source.part02 source.part03 source.part04 source.part05 source.part06 > ReisePilot-v5.8-Build32-Source.zip

      - name: Verify source archive
        run: echo "f6f1d2f97f6e2ff05a4150703068825f98d067a4a391e02ea58eb514dba5e8d6  ReisePilot-v5.8-Build32-Source.zip" | sha256sum -c -

      - uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-v5.8-Build32-Source
          path: ReisePilot-v5.8-Build32-Source.zip
          if-no-files-found: error
