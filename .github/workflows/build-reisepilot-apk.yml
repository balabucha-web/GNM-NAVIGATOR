name: Build ReisePilot APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'reisepilot-app/**'
      - '.github/workflows/build-reisepilot-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: reisepilot-app
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          cp reisepilot-app/app/build/outputs/apk/debug/app-debug.apk ReisePilot-debug.apk
          sha256sum ReisePilot-debug.apk > ReisePilot-debug.apk.sha256
          ls -lh ReisePilot-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReisePilot-APK
          path: |
            ReisePilot-debug.apk
            ReisePilot-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
