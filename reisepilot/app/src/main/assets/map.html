<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js"></script>
<style>
html,body,#map{height:100%;margin:0}
body{background:#eaf0f5;font-family:system-ui}
#notice{position:absolute;z-index:5;left:12px;right:12px;top:12px;padding:11px 13px;border-radius:13px;background:rgba(24,38,63,.92);color:#fff;font-size:13px;display:none}
.mapboxgl-ctrl-attrib{font-size:9px}
</style>
</head>
<body>
<div id="map"></div>
<div id="notice"></div>
<script>
let map=null, loaded=false, lastToken='', lastPayload=null;
const colors={low:'#18794e',moderate:'#d69e00',heavy:'#e56b35',severe:'#b42318',unknown:'#176b87'};
function notice(text){const n=document.getElementById('notice');n.textContent=text;n.style.display=text?'block':'none';}
function init(token){
 if(!token || !token.startsWith('pk.')){notice('Mapbox-Token unter „Mehr“ eintragen.');return;}
 if(map && token===lastToken)return;
 lastToken=token;mapboxgl.accessToken=token;
 map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/streets-v12',center:[7.1,48.8],zoom:5.2,attributionControl:true});
 map.addControl(new mapboxgl.NavigationControl({showCompass:true}),'top-right');
 map.on('load',()=>{loaded=true;notice('');if(lastPayload)render(lastPayload);});
 map.on('error',()=>notice('Kartendaten konnten nicht geladen werden.'));
}
function featuresFromRoute(geometry,congestion){
 const coords=geometry&&geometry.coordinates?geometry.coordinates:[];if(coords.length<2)return [];
 const features=[];for(let i=0;i<coords.length-1;i++)features.push({type:'Feature',properties:{level:congestion[i]||'unknown'},geometry:{type:'LineString',coordinates:[coords[i],coords[i+1]]}});return features;
}
function source(id,data){if(map.getSource(id))map.getSource(id).setData(data);else map.addSource(id,{type:'geojson',data});}
function ensureLayers(){
 if(!map.getLayer('route'))map.addLayer({id:'route',type:'line',source:'route',paint:{'line-width':['interpolate',['linear'],['zoom'],5,4,12,8],'line-color':['match',['get','level'],'low',colors.low,'moderate',colors.moderate,'heavy',colors.heavy,'severe',colors.severe,colors.unknown],'line-opacity':.92}});
 if(!map.getLayer('points'))map.addLayer({id:'points',type:'circle',source:'points',paint:{'circle-radius':['match',['get','type'],'current',9,'toll',7,'fuel',7,6],'circle-color':['match',['get','type'],'current','#176b87','toll','#b77900','fuel','#18794e','#18263f'],'circle-stroke-color':'#ffffff','circle-stroke-width':3}});
}
function render(p){
 if(!map||!loaded)return;let geometry=null;try{geometry=p.routeGeoJson?JSON.parse(p.routeGeoJson):null}catch(e){}let congestion=[];try{congestion=p.congestionJson?JSON.parse(p.congestionJson):[]}catch(e){}
 const routeFC={type:'FeatureCollection',features:featuresFromRoute(geometry,congestion)},pointFeatures=[];
 if(p.lat!=null&&p.lon!=null)pointFeatures.push({type:'Feature',properties:{type:'current',name:'Aktuell'},geometry:{type:'Point',coordinates:[p.lon,p.lat]}});
 (p.tolls||[]).forEach(t=>pointFeatures.push({type:'Feature',properties:{type:'toll',name:t.name},geometry:{type:'Point',coordinates:[t.point.lon,t.point.lat]}}));
 const fuels=p.stage==='SATURDAY'?[[11.0182,49.3278,'BayWa Schwabach'],[6.8179,47.5015,'E.Leclerc Montbéliard']]:[[4.8076,44.1379,'Intermarché Orange']];
 fuels.forEach(f=>pointFeatures.push({type:'Feature',properties:{type:'fuel',name:f[2]},geometry:{type:'Point',coordinates:[f[0],f[1]]}}));
 source('route',routeFC);source('points',{type:'FeatureCollection',features:pointFeatures});ensureLayers();
 if(geometry&&geometry.coordinates&&geometry.coordinates.length){const bounds=geometry.coordinates.reduce((b,c)=>b.extend(c),new mapboxgl.LngLatBounds(geometry.coordinates[0],geometry.coordinates[0]));map.fitBounds(bounds,{padding:45,duration:650,maxZoom:12});}
 else if(p.lat!=null&&p.lon!=null)map.easeTo({center:[p.lon,p.lat],zoom:11,duration:500});
}
window.ReisePilot={update:function(raw){try{const p=JSON.parse(raw);lastPayload=p;init(p.token||'');if(map&&loaded)render(p);}catch(e){notice('Kartendaten ungültig.');}}};
</script>
</body>
</html>
